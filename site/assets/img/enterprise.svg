<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Custom enterprise systems — connected modules and workflows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121916"/>
      <stop offset="1" stop-color="#0b0f0e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#40dca9" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- hub -->
  <g>
    <circle cx="400" cy="250" r="60" fill="#40dca9"/>
    <circle cx="400" cy="250" r="60" fill="none" stroke="#40dca9" stroke-opacity=".3" stroke-width="2"/>
    <text x="400" y="244" text-anchor="middle" fill="#0b0f0e" font-family="ui-monospace, monospace" font-size="30" font-weight="700">V</text>
    <text x="400" y="268" text-anchor="middle" fill="#0b0f0e" font-family="ui-monospace, monospace" font-size="12" font-weight="700">CORE</text>
  </g>

  <!-- connectors -->
  <g stroke="#33413b" stroke-width="2">
    <path d="M340 210 L 200 130"/>
    <path d="M460 210 L 600 130"/>
    <path d="M340 290 L 200 370"/>
    <path d="M460 290 L 600 370"/>
    <path d="M400 190 L 400 100"/>
    <path d="M400 310 L 400 400"/>
  </g>

  <!-- modules -->
  <g>
    <g transform="translate(150 92)">
      <rect x="0" y="0" width="110" height="54" rx="8" fill="#0f1513" stroke="#40dca9" stroke-width="2"/>
      <rect x="12" y="14" width="44" height="6" rx="3" fill="#40dca9"/>
      <rect x="12" y="30" width="70" height="6" rx="3" fill="#2b3530"/>
    </g>
    <g transform="translate(540 92)">
      <rect x="0" y="0" width="110" height="54" rx="8" fill="#0f1513" stroke="#4f9de0" stroke-width="2"/>
      <rect x="12" y="14" width="44" height="6" rx="3" fill="#4f9de0"/>
      <rect x="12" y="30" width="70" height="6" rx="3" fill="#2b3530"/>
    </g>
    <g transform="translate(150 332)">
      <rect x="0" y="0" width="110" height="54" rx="8" fill="#0f1513" stroke="#d9a441" stroke-width="2"/>
      <rect x="12" y="14" width="44" height="6" rx="3" fill="#d9a441"/>
      <rect x="12" y="30" width="70" height="6" rx="3" fill="#2b3530"/>
    </g>
    <g transform="translate(540 332)">
      <rect x="0" y="0" width="110" height="54" rx="8" fill="#0f1513" stroke="#40dca9" stroke-width="2"/>
      <rect x="12" y="14" width="44" height="6" rx="3" fill="#40dca9"/>
      <rect x="12" y="30" width="70" height="6" rx="3" fill="#2b3530"/>
    </g>
    <g transform="translate(345 100)">
      <rect x="0" y="0" width="110" height="54" rx="8" fill="#0f1513" stroke="#40dca9" stroke-width="2"/>
      <rect x="12" y="14" width="44" height="6" rx="3" fill="#40dca9"/>
      <rect x="12" y="30" width="70" height="6" rx="3" fill="#2b3530"/>
    </g>
    <g transform="translate(345 362)">
      <rect x="0" y="0" width="110" height="54" rx="8" fill="#0f1513" stroke="#4f9de0" stroke-width="2"/>
      <rect x="12" y="14" width="44" height="6" rx="3" fill="#4f9de0"/>
      <rect x="12" y="30" width="70" height="6" rx="3" fill="#2b3530"/>
    </g>
  </g>

  <!-- module labels -->
  <g fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="13">
    <text x="205" y="170" text-anchor="middle">CRM</text>
    <text x="595" y="170" text-anchor="middle">PAYMENTS</text>
    <text x="205" y="410" text-anchor="middle">OPS</text>
    <text x="595" y="410" text-anchor="middle">ANALYTICS</text>
    <text x="400" y="178" text-anchor="middle">PORTAL</text>
    <text x="400" y="430" text-anchor="middle">INTEGRATIONS</text>
  </g>
</svg>
