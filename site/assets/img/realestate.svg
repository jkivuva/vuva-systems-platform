<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Real estate — property management, tenants and rent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121916"/>
      <stop offset="1" stop-color="#0b0f0e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#40dca9" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40dca9"/>
      <stop offset="1" stop-color="#087957"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- buildings -->
  <g>
    <rect x="120" y="200" width="150" height="180" rx="6" fill="#0f1513" stroke="#40dca9" stroke-width="2"/>
    <g fill="#40dca9" opacity=".85">
      <rect x="142" y="224" width="26" height="20" rx="2"/>
      <rect x="182" y="224" width="26" height="20" rx="2"/>
      <rect x="222" y="224" width="26" height="20" rx="2"/>
      <rect x="142" y="262" width="26" height="20" rx="2"/>
      <rect x="182" y="262" width="26" height="20" rx="2" opacity=".5"/>
      <rect x="222" y="262" width="26" height="20" rx="2"/>
      <rect x="142" y="300" width="26" height="20" rx="2" opacity=".5"/>
      <rect x="182" y="300" width="26" height="20" rx="2"/>
      <rect x="222" y="300" width="26" height="20" rx="2" opacity=".5"/>
    </g>
    <rect x="182" y="356" width="26" height="24" rx="3" fill="#40dca9"/>

    <rect x="330" y="120" width="120" height="260" rx="6" fill="url(#bld)" opacity=".9"/>
    <g fill="#0b0f0e" opacity=".55">
      <rect x="350" y="150" width="22" height="16" rx="2"/>
      <rect x="384" y="150" width="22" height="16" rx="2"/>
      <rect x="418" y="150" width="22" height="16" rx="2"/>
      <rect x="350" y="184" width="22" height="16" rx="2"/>
      <rect x="384" y="184" width="22" height="16" rx="2"/>
      <rect x="418" y="184" width="22" height="16" rx="2"/>
      <rect x="350" y="218" width="22" height="16" rx="2"/>
      <rect x="384" y="218" width="22" height="16" rx="2"/>
      <rect x="418" y="218" width="22" height="16" rx="2"/>
      <rect x="350" y="252" width="22" height="16" rx="2"/>
      <rect x="384" y="252" width="22" height="16" rx="2"/>
      <rect x="418" y="252" width="22" height="16" rx="2"/>
    </g>
  </g>

  <!-- location pin -->
  <g transform="translate(560 200)">
    <path d="M0 0 C 0 -34 24 -54 24 -54 C 24 -54 48 -34 48 0 C 48 20 24 34 24 34 C 24 34 0 20 0 0 Z" fill="#4f9de0"/>
    <circle cx="24" cy="-6" r="12" fill="#0b0f0e"/>
    <text x="24" y="82" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="14">KILIMANI</text>
  </g>

  <!-- rent stat -->
  <g transform="translate(580 300)">
    <rect x="0" y="0" width="160" height="70" rx="10" fill="#0f1513" stroke="#2b3530"/>
    <text x="14" y="26" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="13">RENT COLLECTED</text>
    <text x="14" y="54" fill="#40dca9" font-family="ui-monospace, monospace" font-size="22" font-weight="700">92%</text>
    <rect x="104" y="38" width="42" height="8" rx="4" fill="#40dca9"/>
  </g>
</svg>
