<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Professional services — client intake, appointments and documents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121916"/>
      <stop offset="1" stop-color="#0b0f0e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#40dca9" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- briefcase -->
  <g transform="translate(120 200)">
    <rect x="0" y="20" width="220" height="140" rx="12" fill="#0f1513" stroke="#40dca9" stroke-width="2"/>
    <rect x="60" y="0" width="100" height="30" rx="8" fill="#40dca9"/>
    <rect x="80" y="-6" width="60" height="12" rx="6" fill="#087957"/>
    <rect x="96" y="66" width="60" height="8" rx="4" fill="#40dca9"/>
    <rect x="96" y="86" width="100" height="8" rx="4" fill="#2b3530"/>
    <rect x="96" y="104" width="84" height="8" rx="4" fill="#2b3530"/>
    <circle cx="170" cy="132" r="14" fill="#40dca9"/>
    <rect x="166" y="124" width="8" height="16" rx="4" fill="#0f1513"/>
  </g>

  <!-- document -->
  <g transform="translate(400 180)">
    <rect x="0" y="0" width="180" height="220" rx="8" fill="#0f1513" stroke="#4f9de0" stroke-width="2"/>
    <rect x="20" y="20" width="60" height="10" rx="5" fill="#4f9de0"/>
    <rect x="20" y="44" width="140" height="6" rx="3" fill="#2b3530"/>
    <rect x="20" y="60" width="120" height="6" rx="3" fill="#2b3530"/>
    <rect x="20" y="76" width="140" height="6" rx="3" fill="#2b3530"/>
    <rect x="20" y="92" width="100" height="6" rx="3" fill="#2b3530"/>
    <rect x="20" y="122" width="140" height="2" fill="#2b3530"/>
    <g stroke="#40dca9" stroke-width="3" stroke-linecap="round">
      <path d="M30 156 l 10 10 l 20 -22"/>
      <path d="M30 182 l 10 10 l 20 -22"/>
    </g>
    <rect x="96" y="148" width="60" height="8" rx="4" fill="#40dca9"/>
    <rect x="96" y="176" width="60" height="8" rx="4" fill="#40dca9"/>
  </g>

  <!-- calendar -->
  <g transform="translate(620 200)">
    <rect x="0" y="0" width="150" height="140" rx="10" fill="#0f1513" stroke="#d9a441" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="34" rx="10" fill="#d9a441"/>
    <text x="14" y="23" fill="#0f1513" font-family="ui-monospace, monospace" font-size="14" font-weight="700">APPOINTMENTS</text>
    <g font-family="ui-monospace, monospace" font-size="13">
      <text x="14" y="62" fill="#E2E8F0">09:00 · Client A</text>
      <text x="14" y="86" fill="#E2E8F0">11:30 · Client B</text>
      <text x="14" y="110" fill="#E2E8F0">14:00 · Client C</text>
    </g>
  </g>
</svg>
