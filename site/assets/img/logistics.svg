<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Logistics and transportation — fleet, routes and shipment tracking">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121916"/>
      <stop offset="1" stop-color="#0b0f0e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#40dca9" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="truck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40dca9"/>
      <stop offset="1" stop-color="#087957"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- route network -->
  <path d="M120 360 C 260 360 260 200 400 200 S 560 300 700 240" fill="none" stroke="#33413b" stroke-width="2" stroke-dasharray="1 8" stroke-linecap="round"/>
  <path d="M120 360 C 260 360 260 200 400 200 S 560 300 700 240" fill="none" stroke="#40dca9" stroke-width="3" stroke-linecap="round" stroke-dasharray="90 900"/>

  <!-- origin / destination pins -->
  <g>
    <circle cx="120" cy="360" r="10" fill="#40dca9"/>
    <circle cx="120" cy="360" r="20" fill="none" stroke="#40dca9" stroke-opacity=".35"/>
    <text x="120" y="398" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="15">NAIROBI</text>
  </g>
  <g>
    <circle cx="700" cy="240" r="10" fill="#4f9de0"/>
    <circle cx="700" cy="240" r="20" fill="none" stroke="#4f9de0" stroke-opacity=".35"/>
    <text x="700" y="282" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="15">MOMBASA</text>
  </g>

  <!-- truck -->
  <g transform="translate(330 150)">
    <rect x="0" y="0" width="240" height="120" rx="8" fill="url(#truck)"/>
    <rect x="0" y="0" width="170" height="92" rx="6" fill="#0f1513" opacity=".18"/>
    <rect x="176" y="34" width="44" height="52" rx="4" fill="#0f1513" opacity=".35"/>
    <path d="M176 34 h34 v26 h-44 v-16 a6 6 0 0 1 6-6 z" fill="#0f1513" opacity=".35"/>
    <circle cx="66" cy="120" r="30" fill="#0b0f0e"/>
    <circle cx="66" cy="120" r="16" fill="#2b3530"/>
    <circle cx="206" cy="120" r="30" fill="#0b0f0e"/>
    <circle cx="206" cy="120" r="16" fill="#2b3530"/>
    <rect x="14" y="58" width="86" height="12" rx="6" fill="#0f1513" opacity=".5"/>
    <rect x="14" y="80" width="60" height="6" rx="3" fill="#0f1513" opacity=".4"/>
  </g>

  <!-- status chips -->
  <g font-family="ui-monospace, monospace" font-size="14">
    <rect x="520" y="316" width="150" height="34" rx="17" fill="#0f1513" stroke="#40dca9" stroke-opacity=".5"/>
    <circle cx="544" cy="333" r="5" fill="#40dca9"/>
    <text x="560" y="339" fill="#40dca9">IN TRANSIT</text>
  </g>
</svg>
