<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Hospitality and restaurants — ordering, kitchen and delivery">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121916"/>
      <stop offset="1" stop-color="#0b0f0e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#40dca9" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="cloche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40dca9"/>
      <stop offset="1" stop-color="#087957"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- cloche -->
  <g transform="translate(120 180)">
    <path d="M0 120 a 120 120 0 0 1 240 0 z" fill="url(#cloche)"/>
    <path d="M20 120 a 100 100 0 0 1 200 0" fill="none" stroke="#0b0f0e" stroke-opacity=".25" stroke-width="6"/>
    <circle cx="120" cy="120" r="12" fill="#0f1513"/>
    <rect x="40" y="120" width="160" height="16" rx="6" fill="#40dca9"/>
    <!-- steam -->
    <g stroke="#40dca9" stroke-opacity=".5" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M80 150 q -8 -18 0 -36 q 8 -18 0 -36"/>
      <path d="M120 150 q -8 -18 0 -36 q 8 -18 0 -36"/>
      <path d="M160 150 q -8 -18 0 -36 q 8 -18 0 -36"/>
    </g>
  </g>

  <!-- order ticket -->
  <g transform="translate(430 160)">
    <rect x="0" y="0" width="200" height="200" rx="10" fill="#0f1513" stroke="#2b3530"/>
    <rect x="14" y="14" width="70" height="10" rx="5" fill="#40dca9"/>
    <rect x="14" y="40" width="140" height="6" rx="3" fill="#2b3530"/>
    <rect x="14" y="54" width="160" height="6" rx="3" fill="#2b3530"/>
    <rect x="14" y="74" width="140" height="6" rx="3" fill="#2b3530"/>
    <rect x="14" y="96" width="172" height="2" fill="#2b3530"/>
    <g font-family="ui-monospace, monospace" font-size="14">
      <text x="14" y="126" fill="#E2E8F0">2 × Chicken Burger</text>
      <text x="14" y="150" fill="#E2E8F0">1 × Fries (Large)</text>
      <text x="14" y="174" fill="#E2E8F0">1 × Soda 500ml</text>
    </g>
    <rect x="14" y="182" width="52" height="8" rx="4" fill="#d9a441"/>
  </g>

  <!-- status pill -->
  <g transform="translate(430 120)">
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#0f1513" stroke="#40dca9" stroke-opacity=".5"/>
    <circle cx="24" cy="17" r="5" fill="#40dca9"/>
    <text x="40" y="23" fill="#40dca9" font-family="ui-monospace, monospace" font-size="14">PREPARING</text>
  </g>
</svg>
