<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Retail and distribution — inventory, warehouses and sales">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121916"/>
      <stop offset="1" stop-color="#0b0f0e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#40dca9" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40dca9"/>
      <stop offset="1" stop-color="#087957"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- stacked boxes -->
  <g>
    <rect x="150" y="250" width="120" height="120" rx="6" fill="url(#box)"/>
    <path d="M150 250 l 20 -20 h 100 l -20 20" fill="#0f1513" opacity=".3"/>
    <rect x="290" y="250" width="120" height="120" rx="6" fill="#0f1513" stroke="#40dca9" stroke-width="2"/>
    <rect x="220" y="150" width="120" height="100" rx="6" fill="#0f1513" stroke="#4f9de0" stroke-width="2"/>
    <path d="M220 150 l 18 -18 h 102 l -18 18" fill="#4f9de0" opacity=".25"/>
    <path d="M220 150 l 18 -18 h 102 l -18 18" fill="none" stroke="#4f9de0" stroke-width="2"/>
  </g>

  <!-- barcode -->
  <g transform="translate(460 250)">
    <rect x="0" y="0" width="220" height="120" rx="6" fill="#0f1513" stroke="#2b3530"/>
    <g fill="#40dca9">
      <rect x="20" y="24" width="6" height="72"/>
      <rect x="32" y="24" width="3" height="72"/>
      <rect x="41" y="24" width="8" height="72"/>
      <rect x="55" y="24" width="4" height="72"/>
      <rect x="65" y="24" width="10" height="72"/>
      <rect x="81" y="24" width="4" height="72"/>
      <rect x="91" y="24" width="6" height="72"/>
      <rect x="103" y="24" width="3" height="72"/>
      <rect x="112" y="24" width="9" height="72"/>
      <rect x="127" y="24" width="4" height="72"/>
      <rect x="137" y="24" width="7" height="72"/>
    </g>
    <text x="20" y="110" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="13">SKU 0412-889</text>
  </g>

  <!-- stock stat -->
  <g transform="translate(150 150)">
    <text x="0" y="0" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="14">LIVE STOCK</text>
    <text x="0" y="34" fill="#40dca9" font-family="ui-monospace, monospace" font-size="26" font-weight="700">12,480</text>
    <text x="0" y="56" fill="#5d6965" font-family="ui-monospace, monospace" font-size="13">units · 3 warehouses</text>
  </g>
</svg>
